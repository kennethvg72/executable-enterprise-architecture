# platform-lb in dc2. Internal applications and database endpoints.

global
  log stdout format raw local0
  maxconn 20000
  ssl-default-bind-options ssl-min-ver TLSv1.3
  ssl-default-server-options ssl-min-ver TLSv1.3

defaults
  log global
  timeout connect 3s
  timeout client 60s
  timeout server 60s
  # Readiness is checked every 2s; 3 failures take a server out, 2 successes put it back (RES-06).
  default-server inter 2s fall 3 rise 2

# ---- Internal applications: TLS terminated here and re-encrypted to the backend (SEC-04).
frontend apps
  mode http
  bind 10.2.50.10:443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
  option forwardfor
  # Overload protection: reject quickly rather than queue (RES-08).
  maxconn 5000
  use_backend rejection-triage if { req.hdr(host),field(1,:) -i rejection-triage.natax.internal }
  default_backend unknown-application

backend rejection-triage
  mode http
  balance leastconn
  option httpchk
  http-check send meth GET uri /health/ready ver HTTP/1.1 hdr Host rejection-triage.natax.internal
  http-check expect status 200
  timeout queue 2s
  server dc2-1 10.2.20.31:8443 check ssl verify required ca-file /etc/haproxy/ca/natax-workload-ca.pem sni str(rejection-triage.natax.internal) verifyhost rejection-triage.natax.internal maxconn 200
  server dc1-1 10.1.20.31:8443 check ssl verify required ca-file /etc/haproxy/ca/natax-workload-ca.pem sni str(rejection-triage.natax.internal) verifyhost rejection-triage.natax.internal maxconn 200 backup

backend unknown-application
  mode http
  http-request return status 404 content-type text/plain string "Unknown application"

# ---- Database endpoints: TCP passthrough, TLS end to end. Routes only to the current
# primary, as reported by Patroni; connections to a demoted primary are cut (RES-05).
listen app-db
  mode tcp
  bind 10.2.50.10:5432
  # Database connections are long-lived and pooled; HTTP timeouts would cut them.
  timeout client 30m
  timeout server 30m
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server dc1 10.1.30.31:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/ca/natax-workload-ca.pem verifyhost app-db-dc1.natax.internal
  server dc2 10.2.30.31:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/ca/natax-workload-ca.pem verifyhost app-db-dc2.natax.internal

listen core-db
  mode tcp
  bind 10.2.50.10:5433
  # Database connections are long-lived and pooled; HTTP timeouts would cut them.
  timeout client 30m
  timeout server 30m
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  default-server inter 2s fall 2 rise 2 on-marked-down shutdown-sessions
  server dc1 10.1.30.11:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/ca/natax-workload-ca.pem verifyhost core-db-dc1.natax.internal
  server dc2 10.2.30.11:5432 check port 8008 check-ssl verify required ca-file /etc/haproxy/ca/natax-workload-ca.pem verifyhost core-db-dc2.natax.internal
