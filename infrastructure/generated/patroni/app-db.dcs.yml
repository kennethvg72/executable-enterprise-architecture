# Generated by infrastructure/tools/render.ts from declared intent. Do not edit.

# Dynamic configuration of app-db, applied to the running cluster by the deployment process:
# merged into what the cluster has, so settings Patroni keeps for itself survive:
#   patronictl -c /etc/patroni/patroni.yml edit-config --apply patroni/app-db.dcs.yml --force
# After applying, and daily, GET /config on the leader must show these values (check-patroni-config.ts).
ttl: 30                            # longer than the WAN rerouting time (sites.md)
loop_wait: 10
retry_timeout: 10
synchronous_mode: true
synchronous_mode_strict: false       # keep writing when the replica is lost (RES-05)
synchronous_node_count: 1
postgresql:
  use_pg_rewind: true
  parameters:
    max_connections: 300            # every consumer's pool fits, with a reserve (INF-05)
    synchronous_commit: "on"
    ssl: "on"
    ssl_min_protocol_version: TLSv1.3
    archive_mode: "on"
    archive_command: "pgbackrest --stanza=app-db archive-push %p"   # to both datacenters (backup-store, DAT-08)
