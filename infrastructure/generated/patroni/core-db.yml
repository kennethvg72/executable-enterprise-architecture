# Generated by infrastructure/tools/render.ts from declared intent. Do not edit.

# Patroni settings shared by every node of core-db. Node-specific settings
# (name, addresses, certificates) are added per node at deployment.
scope: core-db
etcd3:
  protocol: https
  hosts: [10.1.30.21:2379, 10.2.30.21:2379, 10.3.70.21:2379]   # one voting member per site (RES-04)
bootstrap:
  dcs:
    ttl: 30                            # longer than the WAN rerouting time (sites.md)
    loop_wait: 10
    retry_timeout: 10
    synchronous_mode: true
    synchronous_mode_strict: false       # keep writing when the replica is lost (RES-05)
    synchronous_node_count: 1
    postgresql:
      use_pg_rewind: true
      parameters:
        synchronous_commit: "on"
        ssl: "on"
        ssl_min_protocol_version: TLSv1.3
watchdog:
  mode: required                   # fence a primary that loses its leader lock
  device: /dev/watchdog
  safety_margin: 5
tags:
  nofailover: false                  # with synchronous_mode, Patroni promotes only the synchronous replica
