# Connector policy for Power Apps (PA-08). Central IT generates the tenant's policies from this
# file, by connector ID, and checks them daily for drift (DEL-04):
#
# - On every Managed Environment, an advanced connector policy allows exactly the connectors under
#   "allowed". Everything else is unavailable, including connectors Microsoft adds later and the
#   Microsoft 365 connectors that classic DLP can't block.
# - Alongside it, a classic DLP policy for what advanced connector policies don't cover yet:
#   custom connectors, classified by host, and the HTTP connectors, blocked.
#
# An app's connectors (architecture.yaml: runtime.connectors) must all be allowed. A NATAX API is
# declared as "custom:<host>", and its host must match custom-connectors.allowed-hosts (PA-09).

allowed:
  - name: Microsoft Dataverse
    id: shared_commondataserviceforapps
    reason: The app's own data (PA-03).
  - name: SharePoint
    id: shared_sharepointonline
    reason: The app's own data in lists (PA-03). Narrowed to the app's sites where the platform supports it.
  - name: Office 365 Users
    id: shared_office365users
    reason: "Look up colleagues: names, managers."
  - name: Microsoft Teams
    id: shared_teams
    reason: Notify staff, post to a team's channel.
  - name: Office 365 Outlook
    id: shared_office365
    reason: Email to staff only. Mail flow rules block customers as recipients; email to customers goes through notification-service (INT-05).
  - name: Approvals
    id: shared_approvals
    reason: Standard approval flows.

custom-connectors:
  allowed-hosts:
    - pattern: "*.api.natax.example"
      reason: NATAX APIs published to the power-platform zone, called as the signed-in user with OAuth (PA-09).
  everything-else: blocked
  gateway: never                    # custom connectors through the on-premises data gateway can't use OAuth (PA-09)

blocked:                            # classic DLP, always blocked, whatever is requested
  - name: HTTP
    reason: Arbitrary outbound calls would bypass the connector policy, the network policy and PA-09.
  - name: HTTP with Microsoft Entra ID
    reason: As HTTP.
  - name: HTTP Webhook
    reason: As HTTP.
  - name: SQL Server
    reason: Applications use the owner's API, never its database (INT-01).
  - name: Consumer services
    reason: Personal email, personal cloud storage and social media are paths for NATAX data to leave NATAX.
