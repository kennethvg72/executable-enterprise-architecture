# architecture.yaml for a Power Apps solution. See enterprise-architecture/templates/architecture.yaml
# for what every field means, and platforms/power-apps/platform.yaml for this platform's limits.

application: my-power-app
description: One sentence. What problem does it solve, for whom?

problem-owner: jdoe
technical-owner: null
landscape-check: docs/decisions/0000-landscape-check.md   # SIM-09: what already exists, and who was asked

architecture:
  enterprise-architecture: 3.2.2
  power-apps: 1.2.0
  network: 1.0.0
  infrastructure: 1.0.0

exposure: internal                   # staff only: no Power Pages, no guests (PA-10)

users:
  identity-provider: workforce
  roles:                             # each role is an Entra security group, with matching permissions on the data (PA-02, PA-10)
    - name: user
      group: my-power-app-users
      description: What this role can do, in the app and therefore on the data.

data:
  - store: sharepoint                # sharepoint | dataverse (PA-03)
    database: My list                # the list or table
    classification: internal         # at most confidential
    system-of-record-for: []
    retention: P2Y

resilience:
  class: C                           # B or C (PA-01)
  statement: >
    In the Problem Owner's words: how long can users manage without it, and what do they do
    when Microsoft 365 itself is down?

runtime:
  technology: power-apps
  connectors: [SharePoint, Office 365 Users]   # must be in approved-connectors.yaml (PA-08)

alerts:                              # OBS-04
  - name: FlowFailures
    owner: problem-owner
    runbook: docs/runbooks/flow-failures.md

temporary: []
