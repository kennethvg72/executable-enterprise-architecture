# What this platform is for, and its limits. The pipeline reads this file (validate-manifest).

platform: typescript-web
runs-on: datacenters               # DC1 and DC2: the always-applied network and infrastructure architectures apply in full
resilience-classes: [A, B, C]
max-classification: taxpayer-restricted   # with a Technical Owner (OWN-03)
exposure: [internal, staff-edge, internet]   # staff-edge: APIs for NATAX-managed devices, with bearer tokens (AND-05)
data-stores: [app-db, core-db, files]   # PostgreSQL clusters in the landscape, and files on its file storage (DAT-06)
dependencies: approved-dependencies.yaml
evidence:                          # recorded by the Test Agent for every release candidate (record-evidence.ts); the pipeline audits it and runs none of it (DEL-02, SEC-13)
  - { key: type-check, name: Type check, rule: TS-01, run: npx tsc --noEmit }
  - { key: test-results, name: Tests, rule: DEL-02, run: npm test --silent, env: { NODE_OPTIONS: --test-reporter=tap }, format: tap, tests: "**/*.test.ts" }
