# architecture.yaml: fill this in with the Problem Owner. See
# enterprise-architecture/templates/architecture.yaml for what every field means.

application: my-application
description: One sentence. What problem does it solve, for whom?

problem-owner: jdoe
landscape-check: docs/decisions/0000-landscape-check.md   # SIM-09: what already exists, who was asked, the outcome
technical-owner: null

architecture:
  enterprise-architecture: 4.1.1
  typescript-web: 1.3.0
  network: 1.0.0
  infrastructure: 2.0.0

exposure: internal          # internal | staff-edge (an API for managed devices, AND-05) | internet (customers)

users:
  identity-provider: workforce
  roles:
    - name: user
      group: my-application-users
      description: Everything, for now.

data:
  - store: app-db
    database: my_application
    classification: internal
    system-of-record-for: []
    retention: P2Y

resilience:
  class: C
  statement: >
    In the Problem Owner's words: how long can users manage without it, how much recent
    data could they afford to lose, and when does it matter most?

runtime:
  technology: typescript-web
  sites: [dc1]
  instances-per-site: 1
  peak-vcpu: 2
  database-connections: 10       # the pool's maximum per instance (DB_POOL_MAX); counted against the cluster's max_connections
  capacity:
    peak-requests-per-second: 5
    instance-requests-per-second: 50

provides:
  - name: web
    port: 8443
    via: platform-lb
    frontend-port: 443
    health: { port: 8443, path: /health/ready }
    consumers: [zone:workforce]

consumes:
  - service: app-db
    interface: postgres
    database: my_application
    critical: true
    purpose: Stores the application's data.
  - external: workforce-idp
    critical: false
    purpose: Staff sign-in.

alerts:
  - name: ReadinessFailing
    owner: problem-owner
    runbook: docs/runbooks/readiness.md

temporary: []
